name: Concurrent Real-Time
description: >-
  Concurrent Real-Time, Inc. is a provider of high-performance real-time
  computing systems, software, and solutions, headquartered in Pompano Beach,
  Florida. Its portfolio centers on RedHawk Linux, a real-time operating system
  based on Linux; iHawk multiprocessor computer platforms; the NightStar suite
  of development, debugging, and analysis tools; and SIMulation Workbench, a
  real-time simulation framework used for hardware-in-the-loop (HIL) testing and
  model-based design. Concurrent Real-Time serves aerospace, defense,
  automotive, transportation, financial, and industrial simulation markets. The
  company traces its lineage to the real-time division of Concurrent Computer
  Corporation and is backed by Battery Ventures. It operates as a systems and
  embedded-software vendor rather than a public web-API provider, so this API
  Evangelist profile carries company identity rather than API artifacts.
